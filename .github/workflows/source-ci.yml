name: Subtitle-AUTO source validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax verification
        shell: pwsh
        run: |
          @'
          import ast, pathlib
          paths = sorted(pathlib.Path('.').glob('*.py'))
          assert paths, 'No Python source files'
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'Syntax PASS: {len(paths)} Python files')
          '@ | python -
      - name: No models, secrets, media or environments tracked
        shell: pwsh
        run: |
          @'
          import subprocess, pathlib, re
          names = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          forbidden = re.compile(r'(^|/)(models|private|logs|backups|\.venv[^/]*|\.paddlex|__pycache__)(/|$)|\.(safetensors|onnx|gguf|pt|pth|ckpt|bin|sqlite|db|mp4|mkv|wav|mp3|srt|jpg|png)$', re.I)
          bad = [n for n in names if forbidden.search(n)]
          assert not bad, f'Forbidden committed files: {bad}'
          assert 'config.json' not in names, 'Local config tracked'
          print(f'Sensitive-path guard PASS: {len(names)} tracked files')
          '@ | python -

  distribution-bootstrap-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First-run distribution tests
        run: python -m unittest test_distribution_bootstrap -v
      - name: Build portable source preview
        run: python distribution/build_portable.py --output dist/Subtitle-AUTO-source-preview.zip
      - name: Build Inno Setup preview
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = [System.IO.Path]::Combine([Environment]::GetFolderPath('ProgramFilesX86'),'Inno Setup 6','ISCC.exe')
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc distribution/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
      - name: Clean Windows installer install/uninstall smoke
        shell: pwsh
        run: |
          $setup = Join-Path (Get-Location) 'distribution/dist/Subtitle-AUTO-Setup-0.1.0-preview.exe'
          if (!(Test-Path $setup)) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP 'SubtitleAutoCleanInstall'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $target)) -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Install failed: $($proc.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'distribution/bootstrap.py'))) { throw "Missing bootstrap after installation" }
          & python (Join-Path $target 'distribution/bootstrap.py') --check
          if ($LASTEXITCODE -ne 0) { throw "Installed bootstrap failed" }
          $config = Join-Path $target 'config.json'
          if (Test-Path $config) { throw "Installer must not create private config" }
          & python (Join-Path $target 'distribution/bootstrap.py') --init-config
          if (!(Test-Path $config)) { throw "Failed to initialize private config" }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Uninstall failed: $($proc.ExitCode)" }
          if (Test-Path (Join-Path $target 'subtitle_client.py')) { throw "Uninstall left application source" }
      - name: Upload preview artifacts (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-auto-source-only-preview
          path: |
            dist/*.zip
            distribution/dist/*.exe
          if-no-files-found: error
          retention-days: 7
