name: Subtitle-AUTO source validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax verification
        shell: pwsh
        run: |
          @'
          import ast, pathlib
          paths = sorted(pathlib.Path('.').glob('*.py'))
          assert paths, 'No Python source files'
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'Syntax PASS: {len(paths)} Python files')
          '@ | python -
      - name: No models, secrets, media or environments tracked
        shell: pwsh
        run: |
          @'
          import subprocess, pathlib, re
          names = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          forbidden = re.compile(r'(^|/)(models|private|logs|backups|\.venv[^/]*|\.paddlex|__pycache__)(/|$)|\.(safetensors|onnx|gguf|pt|pth|ckpt|bin|sqlite|db|mp4|mkv|wav|mp3|srt|jpg|png)$', re.I)
          bad = [n for n in names if forbidden.search(n)]
          assert not bad, f'Forbidden committed files: {bad}'
          assert 'config.json' not in names, 'Local config tracked'
          print(f'Sensitive-path guard PASS: {len(names)} tracked files')
          '@ | python -

  distribution-bootstrap-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First-run, CPU-GPU and Explorer hotkey tests
        run: python -m unittest test_distribution_bootstrap test_quickstart_cpu test_explorer_alt_s test_optional_engine_catalog -v
      - name: Install standalone CPU build dependencies
        run: python -m pip install --disable-pip-version-check "faster-whisper==1.2.1" "ctranslate2==4.7.1" "av==17.1.0" "pyinstaller>=6,<7" "pywin32==312"
      - name: Replace PyPI wheel with verified LGPL-only PyAV/FFmpeg build
        shell: pwsh
        run: |
          ./distribution/build_lgpl_pyav.ps1
      - name: Check LGPL-only FFmpeg and Faster-Whisper decoder
        shell: pwsh
        run: |
          @'
          import av, faster_whisper, ctranslate2
          from av._core import library_meta
          from faster_whisper.audio import decode_audio
          assert av.__version__ == "17.1.0", av.__version__
          assert ctranslate2.__version__ == "4.7.1", ctranslate2.__version__
          for name, cfg in library_meta.items():
              assert "LGPL" in str(cfg["license"]), (name, cfg["license"])
              opts = str(cfg["configuration"])
              assert "--enable-gpl" not in opts and "--enable-nonfree" not in opts
              assert "--enable-libx264" not in opts and "--enable-libx265" not in opts
              assert "--enable-shared" in opts
          print("LGPL_RELEASE_RUNTIME_BINARY_PASS")
          '@ | python -
      - name: Package pinned FFmpeg/PyAV LGPL corresponding sources
        run: python distribution/build_lgpl_source_bundle.py
      - name: Prepare Whisper tiny in user cache before inference
        shell: pwsh
        run: |
          @'
          import os, pathlib, time
          from faster_whisper import WhisperModel
          cache=pathlib.Path(os.environ["LOCALAPPDATA"])/"Subtitle-AUTO"/"models"
          cache.mkdir(parents=True, exist_ok=True)
          start=time.monotonic()
          WhisperModel("tiny", device="cpu", compute_type="int8", download_root=str(cache))
          print(f"MODEL_PREPARATION_PASS seconds={time.monotonic()-start:.1f}")
          '@ | python -
      - name: Build standalone CPU executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Subtitle-AUTO --distpath distribution/build_binary --workpath distribution/build_work --specpath distribution/build_spec --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all huggingface_hub --collect-all tokenizers --paths distribution --hidden-import hotkey_explorer --hidden-import engine_catalog --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes distribution/quickstart_cpu.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Build binary Portable ZIP
        run: python distribution/build_cpu_portable.py --binary distribution/build_binary/Subtitle-AUTO.exe --output dist/Subtitle-AUTO-Portable-0.1.0.zip
      - name: Build Inno Setup preview
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = [System.IO.Path]::Combine([Environment]::GetFolderPath('ProgramFilesX86'),'Inno Setup 6','ISCC.exe')
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc distribution/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
      - name: Clean Windows installer install/uninstall smoke
        shell: pwsh
        run: |
          $setup = Join-Path (Get-Location) 'distribution/dist/Subtitle-AUTO-Setup-0.1.0.exe'
          if (!(Test-Path $setup)) { throw "Installer artifact missing" }
          $target = Join-Path $env:RUNNER_TEMP 'SubtitleAutoCleanInstall'
          Write-Output 'PHASE_1_INSTALL_START'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $target)) -PassThru
          try { $proc | Wait-Process -Timeout 90 -ErrorAction Stop } catch {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'SETUP_INSTALL_TIMEOUT'
          }
          $proc.Refresh()
          if ($proc.ExitCode -ne 0) { throw "Install failed: $($proc.ExitCode)" }
          Write-Output 'PHASE_1_INSTALL_PASS'
          if (!(Test-Path (Join-Path $target 'distribution/bootstrap.py'))) { throw "Missing bootstrap after installation" }
          $binary = Join-Path $target 'Subtitle-AUTO.exe'
          if (!(Test-Path $binary)) { throw "Missing standalone CPU executable" }
          if (!(Test-Path (Join-Path $target 'PRIVACY.md'))) { throw "Missing privacy notice" }
          if (!(Test-Path (Join-Path $target 'THIRD_PARTY_NOTICES.md'))) { throw "Missing third-party notices" }
          if (!(Test-Path (Join-Path $target 'QUICKSTART_LICENSE.txt'))) { throw "Missing Quickstart license" }
          Write-Output 'HOTKEY_SHELL_COM_PACKAGING_CHECK_START'
          $hotkey = Start-Process -FilePath $binary -ArgumentList @('--verify-alt-s-runtime') -PassThru
          try { $hotkey | Wait-Process -Timeout 65 -ErrorAction Stop } catch {
            Stop-Process -Id $hotkey.Id -Force -ErrorAction SilentlyContinue
            throw "HOTKEY_DEPENDENCY_PACKAGING_TIMEOUT"
          }
          $hotkey.Refresh()
          if ($hotkey.ExitCode -ne 0) { throw "HOTKEY_SHELL_COM_PACKAGING_FAILED" }
          Write-Output 'HOTKEY_SHELL_COM_PACKAGING_PASS'
          $licenseReport = Join-Path $env:RUNNER_TEMP "SubtitleAutoLGPLRuntime.json"
          $env:SUBTITLE_AUTO_LGPL_REPORT = $licenseReport
          $licenseCheck = Start-Process -FilePath $binary -ArgumentList @('--verify-lgpl-runtime') -Wait -PassThru
          if ($licenseCheck.ExitCode -ne 0 -or !(Test-Path $licenseReport)) { throw "Packaged LGPL runtime verification failed" }
          $licenseData = Get-Content $licenseReport -Raw | ConvertFrom-Json
          if (!$licenseData.lgpl_verified) { throw "Packaged FFmpeg library is not LGPL" }
          Write-Output 'PACKAGED_LGPL_BINARY_GATE_PASS'
          Write-Output 'PHASE_2_EXE_HELP_START'
          $help = Start-Process -FilePath $binary -ArgumentList @('--help') -PassThru
          try { $help | Wait-Process -Timeout 90 -ErrorAction Stop } catch {
            Stop-Process -Id $help.Id -Force -ErrorAction SilentlyContinue
            throw 'EXE_HELP_TIMEOUT'
          }
          $help.Refresh()
          if ($help.ExitCode -ne 0) { throw "Standalone executable failed to launch" }
          Write-Output 'PHASE_2_EXE_HELP_PASS'
          # Real speech-to-subtitle acceptance on a fresh Windows runner (English SAPI fixture).
          Add-Type -AssemblyName System.Speech
          Write-Output 'PHASE_3_SPEECH_FIXTURE_START'
          $speech = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = Join-Path $env:RUNNER_TEMP 'SubtitleAutoEnglishSpeech.wav'
          $speech.SetOutputToWaveFile($wav)
          $speech.Speak('Hello. This is a test of automatic speech recognition. The subtitles should appear after processing.')
          $speech.Dispose()
          if (!(Test-Path $wav)) { throw "Speech fixture not created" }
          Write-Output 'PHASE_3_SPEECH_FIXTURE_PASS'
          Write-Output 'PHASE_4_CPU_INFERENCE_START'
          $log = Join-Path $env:RUNNER_TEMP 'SubtitleAutoInfer.log'
          $diag = Join-Path $env:RUNNER_TEMP 'SubtitleAutoInfer.stderr.log'
          Write-Output "CI_DIAG_MODEL_CACHE: $env:LOCALAPPDATA\\Subtitle-AUTO\\models"
          $env:SUBTITLE_AUTO_DIAG_LOG = Join-Path $env:RUNNER_TEMP 'SubtitleAutoPhases.log' 
          $infer = Start-Process -FilePath $binary -ArgumentList @('--input', ('"' + $wav + '"'), '--model','tiny','--language','en','--device','cpu') -PassThru -RedirectStandardOutput $log -RedirectStandardError $diag
          try {
            $infer | Wait-Process -Timeout 360 -ErrorAction Stop
          } catch {
            Stop-Process -Id $infer.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $env:SUBTITLE_AUTO_DIAG_LOG) { Get-Content $env:SUBTITLE_AUTO_DIAG_LOG -Tail 80 }
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            if (Test-Path $diag) { Get-Content $diag -Tail 80 }
            throw "CPU transcription did not finish within six minutes"
          }
          $infer.Refresh()
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          if (Test-Path $diag) { Get-Content $diag -Tail 80 }
          if ($infer.ExitCode -ne 0) { throw "CPU transcription failed: $($infer.ExitCode)" }
          Write-Output 'PHASE_4_CPU_INFERENCE_EXIT_PASS'
          $srt = [System.IO.Path]::ChangeExtension($wav, 'srt')
          if (!(Test-Path $srt)) { throw "Missing generated SRT" }
          $srtText = [System.IO.File]::ReadAllText($srt, [System.Text.Encoding]::UTF8)
          if ($srtText -notmatch '-->') { throw "Invalid generated SRT" }
          Write-Output 'CLEAN_WINDOWS_CPU_SPEECH_TO_SRT_E2E_PASS'
          & python (Join-Path $target 'distribution/bootstrap.py') --check
          if ($LASTEXITCODE -ne 0) { throw "Installed bootstrap failed" }
          $config = Join-Path $target 'config.json'
          if (Test-Path $config) { throw "Installer must not create private config" }
          & python (Join-Path $target 'distribution/bootstrap.py') --init-config
          if (!(Test-Path $config)) { throw "Failed to initialize private config" }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Uninstall failed: $($proc.ExitCode)" }
          if (Test-Path (Join-Path $target 'subtitle_client.py')) { throw "Uninstall left application source" }
      - name: Upload LGPL build proof plus Windows distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-auto-windows-lgpl-0.1.0-validation
          path: |
            dist/*.zip
            distribution/dist/*.exe
            distribution/lgpl-build-output/LGPL_PYAV_PROVENANCE.json
            distribution/lgpl-build-output/FFMPEG_BUILD_CONFIGURATION.txt
            distribution/lgpl-build-output/FFMPEG_VERSION.txt
          if-no-files-found: error
          retention-days: 7
